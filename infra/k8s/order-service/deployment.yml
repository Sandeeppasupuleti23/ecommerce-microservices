apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: ecommerce
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: ecommerce/order-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081

          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            initialDelaySeconds: 20
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            initialDelaySeconds: 40
            periodSeconds: 20

          env:
            - name: SPRING_CONFIG_IMPORT
              value: optional:configserver:http://config-server:8888

            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: http://eureka-server:8761/eureka/

            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092

            - name: ORDER_DB_URL
              value: jdbc:postgresql://postgres:5432/orders

            - name: ORDER_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: ecommerce-runtime
                  key: ORDER_DB_USERNAME

            - name: ORDER_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ecommerce-runtime
                  key: ORDER_DB_PASSWORD

---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: ecommerce
spec:
  selector:
    app: order-service
  ports:
    - port: 8081
      targetPort: 8081